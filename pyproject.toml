[project]
name = "notebook-assistant"
version = "0.1.0.dev0"
description = "An AI assistant that keeps an Obsidian vault organized under one handbook, with every change approved."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Jason" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
notebook-assistant = "notebook_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_assistant"]

# The release carries the handbook it was tested against. This is the build output of
# docs/handbook.md, the single source of the rules; it is never edited separately.
[tool.hatch.build.targets.wheel.force-include]
"docs/handbook.md" = "notebook_assistant/_handbook.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLW1514"]
ignore = ["RUF001", "RUF002", "RUF003"]  # full-width punctuation (？) is intentional in a bilingual vault

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true
